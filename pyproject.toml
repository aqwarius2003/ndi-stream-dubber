[project]
name = "pharmalive-dubber"
version = "0.1.0"
description = "PharmaLive Dubber: Real-time dual-branch RU->EN simultaneous dubbing system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ndi-python>=6.3.0",
    "google-genai>=3.0.0",
    "websockets>=13.0",
    "scipy>=1.14.0",
    "numpy>=2.0.0",
    "rich>=13.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.8.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
dubber = "dubber.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dubber"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"


